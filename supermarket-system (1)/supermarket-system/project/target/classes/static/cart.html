<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshCart — Your Shopping Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topnav">
    <a href="index.html" class="brand">
        <div class="brand-icon">🌿</div>
        <div class="brand-text">Fresh<span>Cart</span></div>
    </a>
    <nav>
        <a href="index.html">🛒 Products</a>
        <a href="orders.html" data-roles="CUSTOMER">📦 My Orders</a>
        <a href="my-payments.html" data-roles="CUSTOMER">💳 My Payments</a>
        <a href="admin-products.html" data-roles="ADMIN">⚙️ Manage Products</a>
        <a href="admin-orders.html" data-roles="ADMIN,STORE_MANAGER">📋 Manage Orders</a>
        <a href="admin-payments.html" data-roles="ADMIN,STORE_MANAGER">💳 Manage Payments</a>
        <a href="reports-dashboard.html" data-roles="ADMIN,STORE_MANAGER">📊 Analytics</a>
        <a href="admin-users.html" data-roles="ADMIN">👥 Manage Users</a>
        <a href="delivery-dashboard.html" data-roles="ADMIN,DELIVERY_STAFF">🛵 Deliveries</a>
        <a href="cart.html" class="cart-pill active" data-roles="CUSTOMER">
            <span class="cart-pill-icon">🛍️</span>
            <span>Cart</span>
            <span id="cartCount">0</span>
        </a>
        <a href="profile.html">👤 Profile</a>
        <a href="#" id="logoutBtn">Log out</a>
    </nav>
</div>

<div class="page">
    <div class="page-header reveal">
        <h1>Your Shopping Cart 🛒</h1>
        <p>Review items in your basket, adjust quantities, and proceed to swift checkout.</p>
    </div>

    <div id="cartContent" class="reveal"><p>Loading cart...</p></div>
</div>

<script src="script.js"></script>
<script>
    let productLookup = {};

    async function renderCart() {
      const user = getUser();
      const container = document.getElementById("cartContent");

      try {
        const [cart, products] = await Promise.all([apiGetCartByUser(user.id), apiGetProducts()]);
        productLookup = Object.fromEntries(products.map((p) => [p.id, p]));

        const items = cart.items || [];
        if (items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3 style="margin-bottom:8px;">Your basket is currently empty</h3>
              <p style="margin-bottom:20px;">Explore our organic orchard fruits, bakery & fresh dairy!</p>
              <a href="index.html" class="btn btn-primary">Start Shopping Now →</a>
            </div>`;
          return;
        }

        let total = 0;
        const rows = items
          .map((item) => {
            const product = productLookup[item.productId] || { name: "Grocery Item #" + item.productId, price: 0 };
            const subtotal = product.price * item.quantity;
            total += subtotal;
            const imgUrl = getProductImageUrl(product);

            return `
            <tr>
              <td>
                <div style="display:flex; align-items:center; gap:14px;">
                  <img src="${imgUrl}" alt="${product.name}" style="width:54px; height:54px; border-radius:10px; object-fit:cover; border:1px solid var(--line); flex-shrink:0;" onerror="this.onerror=null; this.src='${DEFAULT_SUPERMARKET_IMAGE}';">
                  <div>
                    <div style="font-weight:700; color:var(--forest-dark); font-size:0.96rem;">${product.name}</div>
                    <span style="font-size:0.75rem; color:var(--sage); font-weight:600; text-transform:uppercase;">${product.category || "Grocery"}</span>
                  </div>
                </div>
              </td>
              <td style="font-weight:600; color:var(--charcoal);">Rs. ${product.price.toFixed(2)}</td>
              <td>
                <div class="qty-control">
                  <button onclick="changeQty(${item.id}, ${item.quantity - 1})" title="Decrease">-</button>
                  <span>${item.quantity}</span>
                  <button onclick="changeQty(${item.id}, ${item.quantity + 1})" title="Increase">+</button>
                </div>
              </td>
              <td style="font-family:var(--font-display); font-size:1.05rem; font-weight:700; color:var(--forest-dark);">Rs. ${subtotal.toFixed(2)}</td>
              <td>
                <button class="btn btn-danger" style="padding:6px 12px; font-size:0.8rem;" onclick="removeItem(${item.id})">
                  🗑️ Remove
                </button>
              </td>
            </tr>`;
          })
          .join("");

        const freeDeliveryThreshold = 2500;
        const freeDeliveryProgress = Math.min((total / freeDeliveryThreshold) * 100, 100);
        const freeDeliveryDiff = freeDeliveryThreshold - total;

        container.innerHTML = `
          <div style="background:var(--cream-card); border-radius:var(--radius); padding:16px 20px; margin-bottom:20px; border:1px solid var(--line); display:flex; align-items:center; gap:14px;">
            <div style="font-size:1.6rem;">🚚</div>
            <div style="flex:1;">
              <div style="font-size:0.86rem; font-weight:600; color:var(--forest-dark); margin-bottom:4px;">
                ${freeDeliveryDiff <= 0 
                  ? '🎉 Congratulations! You qualify for <strong>FREE Express Delivery</strong>!' 
                  : `Add <strong>Rs. ${freeDeliveryDiff.toFixed(2)}</strong> more to unlock <strong>FREE Express Delivery</strong>!`}
              </div>
              <div style="width:100%; height:6px; background:var(--line); border-radius:999px; overflow:hidden;">
                <div style="height:100%; width:${freeDeliveryProgress}%; background:var(--emerald); transition:width 0.3s ease;"></div>
              </div>
            </div>
          </div>

          <table class="cart-table">
            <thead>
              <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Action</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>

          <div class="cart-summary">
            <div class="box">
              <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.9rem; color:var(--slate);">
                <span>Subtotal</span>
                <span>Rs. ${total.toFixed(2)}</span>
              </div>
              <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:0.9rem; color:var(--slate);">
                <span>Delivery Fee</span>
                <span style="color:${freeDeliveryDiff <= 0 ? 'var(--emerald)' : 'var(--charcoal)'}; font-weight:600;">
                  ${freeDeliveryDiff <= 0 ? 'FREE' : 'Rs. 250.00'}
                </span>
              </div>
              <div class="total-row">
                <span>Total Amount</span>
                <span>Rs. ${(total + (freeDeliveryDiff <= 0 ? 0 : 250)).toFixed(2)}</span>
              </div>
              <button class="btn btn-primary btn-block" style="padding:14px; font-size:1rem;" onclick="goToCheckout()">
                Proceed to Checkout →
              </button>
            </div>
          </div>
        `;
        initScrollReveal();
      } catch (err) {
        container.innerHTML = `<p class="empty-state">Could not load your cart session.</p>`;
        console.error(err);
      }
    }

    async function changeQty(itemId, quantity) {
      if (quantity < 1) { removeItem(itemId); return; }
      try {
        await apiUpdateCartItem(itemId, quantity);
        renderCart();
        updateCartBadge();
        showModernToast("Quantity Updated", "Cart subtotal refreshed.");
      } catch (err) {
        showModernToast("Notice", "Could not update quantity.");
      }
    }

    async function removeItem(itemId) {
      try {
        await apiRemoveCartItem(itemId);
        renderCart();
        updateCartBadge();
        showModernToast("Item Removed", "Item removed from your cart.");
      } catch (err) {
        showModernToast("Notice", "Could not remove item.");
      }
    }

    function goToCheckout() {
      window.location.href = "checkout.html";
    }

    requireRole("CUSTOMER");
    renderCart();
</script>
</body>
</html>
