<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshCart — Manage Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topnav">
    <a href="index.html" class="brand">
        <div class="brand-icon">🌿</div>
        <div class="brand-text">Fresh<span>Cart</span></div>
    </a>
    <nav>
        <a href="index.html">🛒 Storefront</a>
        <a href="admin-products.html" data-roles="ADMIN">⚙️ Manage Products</a>
        <a href="admin-orders.html" data-roles="ADMIN,STORE_MANAGER">📋 Manage Orders</a>
        <a href="admin-payments.html" data-roles="ADMIN,STORE_MANAGER">💳 Manage Payments</a>
        <a href="reports-dashboard.html" data-roles="ADMIN,STORE_MANAGER">📊 Analytics</a>
        <a href="admin-users.html" class="active" data-roles="ADMIN">👥 Manage Users</a>
        <a href="delivery-dashboard.html" data-roles="ADMIN,DELIVERY_STAFF">🛵 Deliveries</a>
        <a href="profile.html">👤 Profile</a>
        <a href="#" id="logoutBtn">Log out</a>
    </nav>
</div>

<div class="page">
    <div class="page-header reveal">
        <h1>Manage User Accounts 👥</h1>
        <p>Assign staff permissions, manage customer roles, or remove accounts.</p>
    </div>

    <table class="cart-table reveal">
        <thead>
            <tr><th>Full Name</th><th>Email</th><th>Assigned Role</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody"><tr><td colspan="4" class="empty-state">Loading accounts...</td></tr></tbody>
    </table>
</div>

<script src="script.js"></script>
<script>
    const ROLES = ["CUSTOMER", "ADMIN", "DELIVERY_STAFF", "STORE_MANAGER"];

    async function loadUsers() {
      const tbody = document.getElementById("usersBody");
      try {
        const users = await apiGetUsers();
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No users registered yet.</td></tr>`;
          return;
        }
        tbody.innerHTML = users
          .map((u) => {
            const options = ROLES.map(
              (r) => `<option value="${r}" ${r === u.role ? "selected" : ""}>${r}</option>`
            ).join("");
            return `
            <tr>
              <td><strong>${u.name}</strong></td>
              <td>${u.email}</td>
              <td><select id="role-${u.id}" class="sort-select" style="padding:6px 12px; font-size:0.85rem;">${options}</select></td>
              <td>
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem;" onclick="saveRole(${u.id})">Save Role</button>
                  <button class="btn btn-danger" style="padding:6px 12px; font-size:0.8rem;" onclick="deleteUser(${u.id})">Delete</button>
                </div>
              </td>
            </tr>`;
          })
          .join("");
        initScrollReveal();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Could not load users.</td></tr>`;
      }
    }

    async function saveRole(userId) {
      const role = document.getElementById(`role-${userId}`).value;
      try {
        const user = await apiGetUser(userId);
        user.role = role;
        await apiUpdateUser(userId, user);
        showModernToast("Role Saved", `User role updated to ${role}.`);
        loadUsers();
      } catch (err) {
        showModernToast("Error", "Could not update user role.");
      }
    }

    async function deleteUser(userId) {
      if (!confirm("Are you sure you want to delete this user?")) return;
      try {
        await apiDeleteUser(userId);
        showModernToast("Deleted", "User account removed.");
        loadUsers();
      } catch (err) {
        showModernToast("Error", "Could not delete user.");
      }
    }

    requireRole("ADMIN");
    loadUsers();
</script>
</body>
</html>
