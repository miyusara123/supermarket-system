<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshCart — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body.login-page {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f4c35 0%, #1a6b4a 40%, #166534 70%, #14532d 100%);
            font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
            position: relative;
        }

        /* Ambient floating orbs */
        .login-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .login-orb-1 { width: 420px; height: 420px; background: rgba(52,211,153,0.18); top: -80px; left: -80px; animation: floatOrb 14s ease-in-out infinite; }
        .login-orb-2 { width: 320px; height: 320px; background: rgba(251,191,36,0.12); bottom: -60px; right: -60px; animation: floatOrb 18s ease-in-out infinite reverse; }
        .login-orb-3 { width: 220px; height: 220px; background: rgba(16,185,129,0.14); top: 50%; right: 10%; animation: floatOrb 12s ease-in-out infinite 3s; }
        @keyframes floatOrb { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-30px) scale(1.08); } }

        /* Main card */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 36px 40px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
        }

        /* Brand row */
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .login-brand-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg,#166534,#22c55e);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(22,101,52,0.3);
        }
        .login-brand-text {
            font-size: 1.5rem; font-weight: 800; color: #14532d;
            font-family: 'Fraunces', serif;
            letter-spacing: -0.5px;
        }
        .login-brand-text span { color: #16a34a; }

        .login-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a2e1a;
            margin-bottom: 4px;
        }
        .login-sub {
            font-size: 0.83rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Form fields */
        .login-field {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 14px;
            margin-bottom: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-field:focus-within {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
            background: #fff;
        }
        .login-field svg {
            width: 18px; height: 18px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .login-field input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-size: 0.9rem;
            font-family: inherit;
            color: #1e293b;
        }
        .login-field input::placeholder { color: #94a3b8; }

        .btn-signin {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #166534, #16a34a);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 6px 20px rgba(22,101,52,0.3);
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }
        .btn-signin:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(22,101,52,0.38); }
        .btn-signin:active { transform: translateY(0); }

        /* Error */
        #loginMessage {
            font-size: 0.82rem;
            color: #dc2626;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }

        /* Divider */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 12px;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .login-divider::before, .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* Quick login buttons */
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .quick-btn {
            padding: 8px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .quick-btn:hover {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #166534;
        }

        /* Footer links */
        .login-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .login-footer a {
            color: #16a34a;
            font-weight: 700;
            text-decoration: none;
        }
        .login-footer a:hover { text-decoration: underline; }
        .login-footer .sep { margin: 0 6px; }
    </style>
</head>
<body class="login-page">

<!-- Background orbs -->
<div class="login-orb login-orb-1"></div>
<div class="login-orb login-orb-2"></div>
<div class="login-orb login-orb-3"></div>

<div class="login-card">
    <!-- Brand -->
    <div class="login-brand">
        <div class="login-brand-icon">🌿</div>
        <div class="login-brand-text">Fresh<span>Cart</span></div>
    </div>

    <div class="login-title">Welcome back! 👋</div>
    <div class="login-sub">Sign in to your FreshCart account</div>

    <form id="loginForm" autocomplete="on">
        <div class="login-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="Email address" required autocomplete="email" />
        </div>
        <div class="login-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-signin">Sign In →</button>
        <div id="loginMessage"></div>
    </form>

    <div class="login-divider">Quick Demo Logins</div>
    <div class="quick-grid">
        <button type="button" class="quick-btn" onclick="fillDemo('customer@freshcart.com','Customer123')">👤 Customer</button>
        <button type="button" class="quick-btn" onclick="fillDemo('admin@freshcart.com','Admin123')">⚙️ Admin</button>
        <button type="button" class="quick-btn" onclick="fillDemo('manager@freshcart.com','Manager123')">📊 Manager</button>
        <button type="button" class="quick-btn" onclick="fillDemo('delivery@freshcart.com','Delivery123')">🛵 Delivery</button>
    </div>

    <div class="login-footer">
        <a href="register.html">Create account</a>
        <span class="sep">•</span>
        <a href="index.html" style="color:#94a3b8;">Browse as Guest</a>
    </div>
</div>

<script src="script.js"></script>
<script>
    function fillDemo(email, pwd) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pwd;
      document.getElementById("loginForm").dispatchEvent(new Event('submit'));
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById("loginMessage");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.querySelector(".btn-signin");

      msgEl.textContent = "";
      btn.textContent = "Signing in...";
      btn.disabled = true;

      try {
        const user = await apiLogin({ email, password });
        setUser(user);
        const destinations = {
          ADMIN: "admin-orders.html",
          DELIVERY_STAFF: "delivery-dashboard.html",
          STORE_MANAGER: "reports-dashboard.html",
          CUSTOMER: "index.html",
        };
        btn.textContent = "✓ Welcome " + (user.name || "").split(" ")[0] + "!";
        btn.style.background = "linear-gradient(135deg,#065f46,#059669)";
        setTimeout(() => {
          window.location.href = destinations[user.role] || "index.html";
        }, 600);
      } catch (err) {
        msgEl.textContent = "Invalid credentials. Please try again.";
        btn.textContent = "Sign In →";
        btn.disabled = false;
      }
    });
</script>
</body>
</html>
